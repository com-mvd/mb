<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: abierta desde el inicio del iPhone la página ocupa también la zona de la hora;
     la barra baja su contenido con env(safe-area-inset-top) para que el título no quede en el difuminado de iOS -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- En el celular, la zona de la hora y la batería va del azul de la barra -->
<meta name="theme-color" content="#0f172a">
<title>MB</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --border:#E6E2DA;
  --text:#1A1714; --text2:#5F5A54; --text3:#9A948C;
  --pend:#eb6834; --pend-bg:#FCE9DF;
  --atr:#d03b3b;  --atr-bg:#F9E1E0;
  --hecho:#1baf7a;--hecho-bg:#DDF3EA;
  --gris:#B5AFA6; --gris-bg:#F0EDE7;
  /* Colores de las filas en la planilla */
  --violeta:#B4A7D6; --azul:#A4C2F4; --naranja:#F9CB9C;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* El body va azul porque Safari (iOS 26+) pinta la zona de la hora con su color de fondo;
   el fondo claro de la página lo lleva .fondo, debajo del título */
html{overflow-y:scroll;scrollbar-gutter:stable;background:#0f172a}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:#0f172a;min-height:100vh;display:flex;flex-direction:column}
.fondo{flex:1;background:radial-gradient(circle at 12% 0%,#EDEEF9 0%,transparent 40%),radial-gradient(circle at 95% 100%,#E7F3EE 0%,transparent 40%),var(--bg);
  background-attachment:fixed}
button,select{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding:1.5rem clamp(16px,2.5vw,2rem) 3rem}

/* Barra del título: igual a la de los dashboards de com-mvd */
.barra{background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
/* En el iPhone abierto desde el inicio, el azul sigue detrás de la hora pero el título baja debajo de ella
   (en Safari y en la PC env() vale 0 y no cambia nada) */
.barra{padding-top:env(safe-area-inset-top,0px)}
/* Abierta desde el ícono, iOS difumina más que la zona de la hora: el título baja un poco más.
   La clase .app la pone el script solo en ese modo */
.app .barra{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
.app .barra-in{min-height:0;padding-top:0;padding-bottom:14px}
/* Franja fija azul detrás de la hora: con un elemento fijo arriba iOS no difumina esa zona.
   Mide lo mismo que la zona de la hora, así que en la PC y en Safari no se ve (alto 0) */
.zona-hora{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0f172a;z-index:3000;pointer-events:none}
.barra-in{max-width:1440px;margin:0 auto;min-height:84px;padding:12px clamp(16px,2.5vw,2rem);display:flex;justify-content:center;align-items:center}
.titulo h1{font-family:'Segoe UI',Arial,sans-serif;font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.15}

/* Mientras carga: solo la ruedita, igual que en com-mvd/dashboard */
.carga{min-height:max(260px,calc(100vh - 84px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ruedita{width:38px;height:38px;border:3px solid #dbe3ed;border-top-color:#2563eb;border-radius:50%;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.carga-t{color:#64748b;font-size:14px;font-weight:600}
.carga-t.error{color:#b42318}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}

/* Día y filtros de servicio y estado (mismo azul que la barra del título) */
.cats{display:flex;justify-content:center;align-items:center;gap:4px;padding:6px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);box-shadow:0 4px 12px rgba(15,23,42,.25);overflow-x:auto;scrollbar-width:none}
.cats button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:#c7d5ea;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;white-space:nowrap}
.cats button:hover{background:rgba(255,255,255,.08);color:#fff}
/* Marcado: el mismo tono que al pasar el mouse, pero más fuerte */
.cats button.on,.cats button.on:hover{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.cats small{font-size:12px;opacity:.7}
.cats i{width:9px;height:9px;border-radius:50%;background:var(--c)}
/* Fecha: mismo tono que el botón marcado, texto y flecha juntos y centrados */
.cats .fecha,.cats .fecha:hover{flex:none;justify-content:center;min-width:150px;padding:9px 16px;
  background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:#fff;font-weight:700}
.fecha svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.fecha[aria-expanded="true"] svg{transform:rotate(180deg)}
/* Lista de días propia, con el azul de la barra (la del navegador era otro estilo).
   Va fija en la pantalla porque la barra recorta lo que sobresale */
.dias{position:fixed;z-index:2000;width:180px;max-height:340px;overflow-y:auto;padding:6px;border-radius:12px;
  background:linear-gradient(160deg,#0f172a 0%,#16213e 60%,#1b3f74 100%);box-shadow:0 12px 28px rgba(15,23,42,.35);
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.dias button{display:block;width:100%;border:0;background:transparent;color:#c7d5ea;font-size:13px;font-weight:600;text-align:center;padding:8px 10px;border-radius:8px}
.dias button:hover{background:rgba(255,255,255,.08);color:#fff}
.dias button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:700}
.cats .sep{flex:none;width:1px;align-self:stretch;margin:4px 6px;background:rgba(255,255,255,.2)}

/* Tabla cerrada tipo planilla: todo centrado; las columnas cortas miden lo justo */
.tabla-card{padding:1rem;border-radius:16px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla td{padding:.55rem .7rem;border:1px solid #ECE9E3;vertical-align:middle;text-align:center;color:var(--text2);line-height:1.35}
.tabla tr>:first-child{border-left:0}
.tabla tr>:last-child{border-right:0}
.tabla tbody tr:first-child td{border-top:0}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla .corta{width:1%;white-space:nowrap}
.tabla td.hora{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
/* La marca del servicio va pintada dentro de la celda Horario (sombra interna, no borde),
   así el encabezado y las filas de turno ocupan todo el ancho sin pedazos sueltos */
.tabla td.marca{box-shadow:inset 6px 0 0 var(--c);padding-left:calc(.7rem + 6px)}
.tabla td.tarea{font-weight:700;color:var(--text);min-width:150px}
.tabla td.texto{white-space:pre-line;min-width:160px}
.tabla tr.turno td{background:#F3F4F8;color:#1b3f74;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.45rem .7rem}
.est{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--bc);color:var(--c);white-space:nowrap}
.est::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.corto{display:none}
.extra,.ab{display:none} /* solo en el celular, al tocar la fila */
.vacio{text-align:center;color:var(--text2);font-size:14px;font-weight:600;padding:2.5rem 1rem}

@media (max-width:760px){
  .barra-in{padding:10px 16px;min-height:64px}
  .titulo h1{font-size:21px}
  .carga{min-height:max(260px,calc(100vh - 64px))}
  .wrap{padding:1rem 12px 2rem}

  /* Barra: la fecha a lo ancho arriba, abajo un renglón de servicios y otro de estados */
  .cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;overflow:visible}
  /* Las mismas líneas grises que en PC, acá horizontales entre cada renglón */
  .cats .sep{grid-column:1/-1;width:auto;height:1px;margin:3px 6px}
  .cats .fecha{grid-column:1/-1}
  .cats button{justify-content:center;flex-wrap:wrap;gap:2px 6px;white-space:normal;text-align:center;line-height:1.2;font-size:12px;padding:8px 4px}
  .cats i{width:8px;height:8px}
  .largo{display:none}
  .corto{display:inline}

  /* Tabla de 3 columnas: Hora, Tarea y un punto con el color del estado.
     Al tocar la fila se despliega abajo el detalle, los supervisores y las observaciones */
  .tabla-card{padding:.5rem}
  .tabla td{padding:.55rem .5rem}
  .tabla td.det,.tabla td.sup,.tabla td.obs{display:none}
  .tabla td.marca{box-shadow:inset 5px 0 0 var(--c);padding-left:calc(.5rem + 5px)}
  .tabla td.hora{font-size:12.5px}
  .tabla td.tarea{min-width:0;font-size:13px;text-align:left}
  .tabla td.estc{width:1%}
  .tabla td.estc .est{font-size:0;gap:0;padding:0;background:none}
  .tabla td.estc .est::before{width:11px;height:11px}
  .tabla tr.con-extra td.tarea{cursor:pointer}
  .tabla tr.con-extra .ab{display:inline-block;margin-left:7px;vertical-align:1px;fill:none;stroke:var(--text3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .tabla tr.abierta .ab{transform:rotate(180deg)}
  .tabla tr.abierta .extra{display:flex}
  .extra{flex-direction:column;gap:5px;margin-top:7px;font-weight:400;font-size:12.5px;color:var(--text2);white-space:pre-line}
  .extra .x-sup{font-size:12px;color:var(--text3)}
  .extra .x-obs{color:var(--text);background:#FAF9F6;border:1px solid #EFECE6;border-radius:8px;padding:.4rem .55rem}
}
</style>
</head>
<body>
<div class="zona-hora" aria-hidden="true"></div>
<header class="barra">
  <div class="barra-in">
    <div class="titulo"><h1>Servicios MB</h1></div>
  </div>
</header>

<div class="fondo">
<div class="carga" id="carga" role="status" aria-live="polite">
  <span class="ruedita" id="ruedita" aria-hidden="true"></span>
  <div class="carga-t" id="cargaT">Cargando información</div>
</div>

<div class="wrap" id="panel" hidden>
  <nav class="cats">
    <button class="fecha" id="fecha" aria-haspopup="listbox" aria-expanded="false">
      <span id="fechaTxt"></span>
      <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </button>
    <span class="sep"></span>
    <div id="filtros" style="display:contents"></div>
  </nav>
  <div class="card tabla-card" id="contenido"></div>
</div>
</div>
<div class="dias" id="dias" role="listbox" hidden></div>

<script>
// Aplicación web del Apps Script que lee la planilla (ver apps-script/Codigo.gs)
const API_URL = 'https://script.google.com/macros/s/AKfycbwKx3Bo1V_IcMkGFb1MWEcwH9bEZI2NH4Topb7CeSdPZDaBrfzUurav2O5g2A2Orkl6/exec';

const SERVICIOS = [
  // En el celular "Tareas " se oculta para que el botón entre en un renglón
  { color: 'violeta', nombre: '<span class="largo">Tareas e</span><span class="corto">E</span>speciales' },
  { color: 'azul',    nombre: 'Agenda' },
  { color: 'naranja', nombre: 'Bolsones' },
];
const ESTADOS = {
  'realizado':  { c: 'var(--hecho)', bc: 'var(--hecho-bg)' },
  'en proceso': { c: 'var(--pend)',  bc: 'var(--pend-bg)' },
  'pendiente':  { c: 'var(--atr)',   bc: 'var(--atr-bg)' },
};
// Filtro por estado: "Sin realizar" junta Pendiente y las vacías, como el recuadro
const FILTRO_ESTADOS = [
  { id: 'realizado',  nombre: 'Realizadas',   c: 'var(--hecho)' },
  { id: 'en proceso', nombre: 'En proceso',   c: 'var(--pend)' },
  { id: 'sin',        nombre: 'Sin realizar', c: 'var(--atr)' },
];
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

const $ = id => document.getElementById(id);
// Abierta como app desde la pantalla de inicio del iPhone
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) {
  document.documentElement.classList.add('app');
}
let filas = [];
let servicio = 'TODOS';
let estado = 'TODOS';

function etiqueta(id) {
  const d = +id.slice(0, 2), m = +id.slice(2);
  return `${DIAS[new Date(2026, m - 1, d).getDay()]} ${id.slice(0, 2)}/${id.slice(2)}`;
}

function escapar(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const deServicio = s => f => s === 'TODOS' || f.color === s;
const deEstado = e => f => {
  const est = f.estado.toLowerCase();
  if (e === 'TODOS') return true;
  if (e === 'sin') return est !== 'realizado' && est !== 'en proceso';
  return est === e;
};

function llenarSelector(fechas, elegida) {
  const ids = fechas.map(f => f.id);
  if (!ids.includes(elegida)) ids.unshift(elegida);
  $('dias').innerHTML = ids.map(id =>
    `<button role="option" class="${id === elegida ? 'on' : ''}" data-dia="${id}">${etiqueta(id)}</button>`).join('');
  $('fechaTxt').textContent = etiqueta(elegida);
}

// Cada grupo cuenta según el filtro del otro grupo
function dibujarFiltros() {
  const porServicio = filas.filter(deServicio(servicio));
  const porEstado = filas.filter(deEstado(estado));
  const boton = (tipo, id, actual, nombre, n, color) =>
    `<button class="${actual === id ? 'on' : ''}" data-${tipo}="${id}">` +
    `${color ? `<i style="--c:${color}"></i>` : ''}<span>${nombre}</span> <small class="num">${n}</small></button>`;
  $('filtros').innerHTML =
    SERVICIOS.map(s => boton('servicio', s.color, servicio, s.nombre,
      porEstado.filter(deServicio(s.color)).length, `var(--${s.color})`)).join('') +
    '<span class="sep"></span>' +
    FILTRO_ESTADOS.map(e => boton('estado', e.id, estado, e.nombre,
      porServicio.filter(deEstado(e.id)).length, e.c)).join('');
}

function dibujarTabla(v) {
  if (!v.length) { $('contenido').innerHTML = '<div class="vacio">Sin tareas.</div>'; return; }

  let actual = null, html = '';
  for (const f of v) {
    if (f.turno !== actual) {
      actual = f.turno;
      html += `<tr class="turno"><td colspan="6">Turno ${escapar(actual.toLowerCase())}</td></tr>`;
    }
    const e = ESTADOS[f.estado.toLowerCase()];
    const etiquetaEstado = f.estado
      ? `<span class="est" style="--c:${e ? e.c : 'var(--gris)'};--bc:${e ? e.bc : 'var(--gris-bg)'}">${escapar(f.estado)}</span>`
      : '';
    // Lo que en el celular se despliega al tocar la fila
    const detalle = f.detalle === '-' ? '' : f.detalle;
    const extra = [
      detalle && `<span>${escapar(detalle)}</span>`,
      f.supervisor && `<span class="x-sup">${escapar(f.supervisor)}</span>`,
      f.observaciones && `<span class="x-obs">${escapar(f.observaciones)}</span>`,
    ].filter(Boolean).join('');
    html += `<tr class="fila${extra ? ' con-extra' : ''}" style="--c:var(--${f.color})">
      <td class="corta hora marca">${escapar(f.horario)}</td>
      <td class="tarea">${escapar(f.tarea)}${extra ? `<svg class="ab" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg><div class="extra">${extra}</div>` : ''}</td>
      <td class="texto det">${escapar(detalle)}</td>
      <td class="corta sup">${escapar(f.supervisor).replace(/, /g, '<br>')}</td>
      <td class="corta estc">${etiquetaEstado}</td>
      <td class="texto obs">${escapar(f.observaciones)}</td>
    </tr>`;
  }
  $('contenido').innerHTML = `<div class="tabla-wrap"><table class="tabla"><tbody>${html}</tbody></table></div>`;
}

function dibujar() {
  const v = filas.filter(deServicio(servicio)).filter(deEstado(estado));
  dibujarFiltros();
  dibujarTabla(v);
}

function mostrarCarga(texto, error) {
  $('panel').hidden = true;
  $('carga').hidden = false;
  $('ruedita').hidden = !!error;
  $('cargaT').textContent = texto;
  $('cargaT').className = 'carga-t' + (error ? ' error' : '');
}

async function cargar(fecha) {
  mostrarCarga('Cargando información');
  try {
    const datos = await (await fetch(API_URL + (fecha ? `?fecha=${fecha}` : ''))).json();
    llenarSelector(datos.fechas, datos.fecha);
    filas = datos.filas;
    dibujar();
    if (datos.error) $('contenido').innerHTML = `<div class="vacio">${escapar(datos.error)}</div>`;
    $('carga').hidden = true;
    $('panel').hidden = false;
  } catch (err) {
    mostrarCarga('No se pudo leer la planilla.', true);
  }
}

// En el celular, tocar una fila despliega o pliega su información
const celular = matchMedia('(max-width:760px)');
$('contenido').addEventListener('click', e => {
  const fila = e.target.closest('tr.con-extra');
  if (fila && celular.matches) fila.classList.toggle('abierta');
});

function cerrarDias() {
  $('dias').hidden = true;
  $('fecha').setAttribute('aria-expanded', 'false');
}

$('fecha').addEventListener('click', e => {
  e.stopPropagation();
  if (!$('dias').hidden) { cerrarDias(); return; }
  const r = $('fecha').getBoundingClientRect();
  $('dias').style.top = (r.bottom + 6) + 'px';
  $('dias').style.left = r.left + 'px';
  $('dias').style.width = Math.max(r.width, 180) + 'px';
  $('dias').hidden = false;
  $('fecha').setAttribute('aria-expanded', 'true');
  const on = $('dias').querySelector('.on');
  if (on) $('dias').scrollTop = on.offsetTop - $('dias').clientHeight / 2;
});
$('dias').addEventListener('click', e => {
  const b = e.target.closest('[data-dia]');
  if (!b) return;
  cerrarDias();
  $('fechaTxt').textContent = etiqueta(b.dataset.dia);
  cargar(b.dataset.dia);
});
document.addEventListener('click', e => { if (!$('dias').contains(e.target)) cerrarDias(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarDias(); });
addEventListener('scroll', cerrarDias);
addEventListener('resize', cerrarDias);
$('filtros').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  // Sin nada marcado se ve todo; tocar el botón marcado lo desmarca
  const alternar = (actual, id) => actual === id ? 'TODOS' : id;
  if (b.dataset.servicio) servicio = alternar(servicio, b.dataset.servicio);
  if (b.dataset.estado) estado = alternar(estado, b.dataset.estado);
  dibujar();
});
cargar(); // sin fecha: el Apps Script devuelve hoy
</script>
</body>
</html>
